<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- The link carries a token. Nothing on this page loads from elsewhere, and this makes
       sure no request from it could hand the token on in a Referer header either. -->
    <meta name="referrer" content="no-referrer" />
    <title>Dezabonare — SmartMeal RO</title>
    <!--
    Where the unsubscribe link in a reminder email lands.

    It does not unsubscribe on arrival. Mail scanners and link previews open every link they
    find, and a page that acted on load would switch people off without them clicking. The
    person presses the button; the button POSTs to the unsubscribe-reminders function, which
    checks the signature.

    Fill ENDPOINT once, with the project's function URL.
  -->
    <style>
      :root {
        --bg: #ffffff;
        --text: #111111;
        --muted: #555555;
        --card: #f4f4f5;
        --border: #e4e4e7;
        --accent: #16a34a;
        --error: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0c;
          --text: #f4f4f5;
          --muted: #a1a1aa;
          --card: #18181b;
          --border: #27272a;
          --accent: #4ade80;
          --error: #f87171;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.55 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      h1 {
        font-size: 24px;
        line-height: 1.25;
        margin: 0 0 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        margin-top: 16px;
      }
      .muted {
        color: var(--muted);
      }
      button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        padding: 12px 18px;
        background: var(--accent);
        color: #ffffff;
        margin-top: 8px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin-top: 14px;
        font-weight: 600;
        min-height: 1.5em;
      }
      #status.error {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mementourile pe email de la SmartMeal RO</h1>
      <p class="muted">
        Apeși o dată și nu mai primești emailuri de la noi. Mementourile de pe telefon, dacă le ai,
        rămân cum sunt.
      </p>

      <div class="card">
        <button id="confirm" type="button">Oprește emailurile</button>
        <p id="status" role="status" aria-live="polite"></p>
      </div>

      <p class="muted">Le poți porni din nou oricând din aplicație, de la ecranul de cont.</p>
    </main>

    <script src="./unsubscribe.js" defer></script>
  </body>
</html>
