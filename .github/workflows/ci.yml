# Every push and pull request: types, lint, SQL migrations, Jest with coverage, the app in a
# real browser, and real sync against a local Supabase started on the runner. No secrets are
# used: the browser tests run without Supabase keys and the sync tests only see the runner's
# own throwaway database.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Types, lint, SQL and Jest
    # Pinned to a known image so runner upgrades (ubuntu-latest -> 26.04) are a deliberate
    # change, not a surprise. Revisit when bumping to the next LTS.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:sql
      - name: Jest (logic and components) with coverage thresholds
        run: npx jest --coverage --maxWorkers=2

  e2e:
    name: App in a browser (Playwright)
    # Pinned to a known image so runner upgrades (ubuntu-latest -> 26.04) are a deliberate
    # change, not a surprise. Revisit when bumping to the next LTS.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Browser only: the runner image already ships Chromium's system libraries. On 2026-11-11
      # the Ubuntu apt mirrors were unreachable from GitHub runners (DNS), and `--with-deps`
      # failed the job just to fetch optional fonts, so those are now best effort.
      - run: npx playwright install chromium
      - name: Optional fonts for the browser (best effort)
        run: npx playwright install-deps chromium
        continue-on-error: true
        timeout-minutes: 5
      - run: npm run test:e2e
      - name: Keep screenshots and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/.results
          retention-days: 7

  sync:
    name: Real sync against a local Supabase
    # Pinned to a known image so runner upgrades (ubuntu-latest -> 26.04) are a deliberate
    # change, not a surprise. Revisit when bumping to the next LTS.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start the local database (migrations 0001 onwards) and its edge functions
        run: npm run db:start
      - run: npm run db:env
      - run: npm run test:sync
      - name: Stop the database
        if: always()
        run: npm run db:stop
